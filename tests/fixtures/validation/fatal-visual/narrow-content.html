<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>narrow content</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      nav[data-role="nav"] { background:#f3f4f6; padding:12px 16px; }
      /* 致命异常：主内容在桌面与移动视口下都被压缩到 40px 宽 */
      main[data-role="main"] { width: 40px; padding: 8px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <nav data-role="nav">App — Records</nav>
    <main data-role="main">
      <h1>Records</h1>
      <p>This paragraph is squeezed into an extremely narrow column so the page cannot be used on any viewport.</p>
      <div data-role="critical">Record A</div>
    </main>
  </body>
</html>
